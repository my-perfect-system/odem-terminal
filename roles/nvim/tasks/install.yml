---
- name: Install nvim apt dependencies
  ansible.builtin.package:
    name:
      - lazygit
      - make
      - gcc
      - gdb
      - wget
      - bzip2
      - curl
      - build-essential
      - lldb
      - libncurses-dev
      - ruby
      - npm
      - fzf
      - fd-find
      - rr
      - ripgrep
      - shellcheck
      - xclip
      - xsel
      - luarocks
      - chktex
      - ansible-lint
      - python3
      - python3-venv
      - python3-pip
      - black
      - flake8
      - pylint
      - mypy
      - pandoc
      - python3-neovim
      - python3-pynvim
    state: present
  when: nvim_enable_apt_deps | bool

- name: Install nvim npm tools globally
  ansible.builtin.command:
    cmd: npm install -g neovim vint luacheck
    creates: /usr/lib/node_modules/neovim
  when: nvim_enable_npm_tools | bool

- name: Ensure nvim tarball target directory exists
  ansible.builtin.file:
    path: /usr/share/mps/tools/nvim/
    state: directory
    mode: "0755"
  when: nvim_enable_tarball | bool

- name: Download nvim upstream tarball
  ansible.builtin.get_url:
    url: https://github.com/neovim/neovim/releases/download/v0.12.1/nvim-linux-x86_64.tar.gz
    dest: /usr/share/mps/tools/nvim/
    mode: "0644"
  when: nvim_enable_tarball | bool

- name: Extract nvim tarball
  ansible.builtin.unarchive:
    src: /usr/share/mps/tools/nvim/nvim-linux-x86_64.tar.gz
    dest: /usr/share/mps/tools/nvim/
    remote_src: true
  when: nvim_enable_tarball | bool

- name: Remove pre-existing /usr/bin/nvim if present
  ansible.builtin.file:
    path: /usr/bin/nvim
    state: absent
  failed_when: false
  when: nvim_enable_tarball | bool

- name: Symlink nvim into /usr/local/bin
  ansible.builtin.file:
    src: /usr/share/mps/tools/nvim/nvim-linux-x86_64/bin/nvim
    dest: /usr/local/bin/nvim
    state: link
  when: nvim_enable_tarball | bool
