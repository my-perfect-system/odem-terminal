argument_specs:
  main:
    short_description: Install and configure Neovim with dependencies
    description:
    - Installs Neovim via tarball, distribution dependencies, npm tools, and deploys
      per-user config.
    options:
      nvim_enable_deps:
        type: bool
        default: true
        description: Install Neovim system dependencies (per-family package lists)
      nvim_enable_npm_tools:
        type: bool
        default: true
        description: Install npm tools for Neovim
      nvim_enable_tarball:
        type: bool
        default: true
        description: Install Neovim tarball
      nvim_yazi_version:
        type: str
        required: false
        default: v26.5.6
        description: Yazi release version tag to download
      nvim_enable_yazi:
        type: bool
        required: false
        default: true
        description: Download and install yazi from GitHub releases
      nvim_enable_fd:
        type: bool
        required: false
        default: true
        description: Install fd-find package
      nvim_enable_tree_sitter:
        type: bool
        required: false
        default: true
        description: Install tree-sitter-cli npm package
      nvim_npm_global_root:
        type: str
        required: false
        default: /usr/lib/node_modules
        description: >-
          npm global install root used for the creates: idempotency check of the
          npm tools task (/usr/local/lib/node_modules on RedHat family,
          /usr/lib/node_modules on Debian).
