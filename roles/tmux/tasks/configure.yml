---
- name: "TERM_TMUX_CONFIGURE - Deploy .config/tmux config"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/.config/tmux/"
    dest: "{{ entity.home }}/.config/tmux/"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
    directory_mode: "0700"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_tmux | default(false)
    - entity.state == 'present'

- name: "TERM_TMUX_CONFIGURE - Deploy .config/tmuxinator config"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/.config/tmuxinator/"
    dest: "{{ entity.home }}/.config/tmuxinator/"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
    directory_mode: "0700"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_tmux | default(false)
    - entity.state == 'present'
