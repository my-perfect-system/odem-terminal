---
- name: "TERM_VIM_CONFIGURE - Deploy .vimrc"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/.vimrc"
    dest: "{{ entity.home }}/.vimrc"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_vim | default(false)
    - entity.state == 'present'

- name: "TERM_VIM_CONFIGURE - Deploy .NERDTreeBookmarks"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/.NERDTreeBookmarks"
    dest: "{{ entity.home }}/.NERDTreeBookmarks"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_vim | default(false)
    - entity.state == 'present'
