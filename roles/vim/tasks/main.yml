---
- name: Install vim and addon packages (Debian)
  ansible.builtin.package:
    name:
      - vim-nox
      - vim-addon-manager
      - vim-airline
      - vim-gruvbox
      - vim-ale
      - vim-autopep8
      - vim-ctrlp
      - vim-fugitive
      - vim-gitgutter
      - vim-snippets
      - vim-syntastic
      - vim-youcompleteme
    state: present
  when:
    - vim_enable_packages | bool
    - ansible_facts['os_family'] == 'Debian'

- name: Install vim packages via dnf CLI
  ansible.builtin.command: dnf install -y vim-enhanced
  when:
    - vim_enable_packages | bool
    - ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_vim
  changed_when: "'Nothing to do' not in dnf_install_vim.stdout"

- name: Install lua development packages (Debian)
  ansible.builtin.package:
    name:
      - liblua5.3-dev
      - liblua5.1-dev
      - lua5.1
      - lua5.3
    state: present
  when:
    - vim_enable_lua | bool
    - ansible_facts['os_family'] == 'Debian'

- name: Install lua development packages via dnf CLI
  ansible.builtin.command: dnf install -y lua lua-devel
  when:
    - vim_enable_lua | bool
    - ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_lua
  changed_when: "'Nothing to do' not in dnf_install_lua.stdout"

- name: Install xclip package (Debian)
  ansible.builtin.package:
    name: xclip
    state: present
  when:
    - vim_enable_xclip | bool
    - ansible_facts['os_family'] == 'Debian'

- name: Install xclip package via dnf CLI
  ansible.builtin.command: dnf install -y xclip
  when:
    - vim_enable_xclip | bool
    - ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_xclip
  changed_when: "'Nothing to do' not in dnf_install_xclip.stdout"

- name: Check if repo directory exists
  ansible.builtin.file:
    path: "{{ vim_repos_dir }}"
    state: directory
    mode: "0777"
    owner: "root"
    group: "root"

- name: Check if mps-vim directory exists
  ansible.builtin.stat:
    path: "{{ vim_repos_dir }}/mps-vim"
  register: vim_repo_dir

- name: Check if mps-vim is a Git repository
  ansible.builtin.stat:
    path: "{{ vim_repos_dir }}/mps-vim/.git"
  register: vim_git_dir
  when: vim_repo_dir.stat.exists

- name: Clone mps-vim repository
  ansible.builtin.git:
    repo: "{{ vim_repo }}"
    dest: "{{ vim_repos_dir }}/mps-vim"
    version: "{{ vim_version }}"
    force: true
  become: true
  when: not vim_repo_dir.stat.exists

- name: Ensure permissions for target directory
  ansible.builtin.file:
    path: "{{ vim_repos_dir }}/mps-vim"
    state: directory
    owner: "root"
    group: "{{ user_default_admin_group }}"
    recurse: yes
    mode: "2775"
  become: true

- name: Pull mps-vim repository
  ansible.builtin.git:
    repo: "{{ vim_repo }}"
    dest: "{{ vim_repos_dir }}/mps-vim"
    version: "{{ vim_version }}"
    force: true
    update: true
  become: true
  when:
    - vim_repo_dir.stat.exists
    - vim_git_dir.stat.exists

- name: Deploy per-user .vimrc
  ansible.builtin.copy:
    src: "{{ vim_repos_dir }}/mps-vim/.vimrc"
    dest: "{{ entity.home }}/.vimrc"
    remote_src: true
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_vim | default(false)
    - entity.state == 'present'

- name: Deploy per-user .NERDTreeBookmarks
  ansible.builtin.copy:
    src: "{{ vim_repos_dir }}/mps-vim/.NERDTreeBookmarks"
    dest: "{{ entity.home }}/.NERDTreeBookmarks"
    remote_src: true
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_vim | default(false)
    - entity.state == 'present'
