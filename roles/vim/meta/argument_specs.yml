argument_specs:
  main:
    short_description: Configure vim dotfiles per user
    options:
      vim_enable_packages:
        type: bool
        required: false
        default: true
        description: Install the vim package set (vim-nox + addons on Debian, vim-enhanced on Fedora)
      vim_enable_lua:
        type: bool
        required: false
        default: true
        description: Install lua development packages
      vim_enable_xclip:
        type: bool
        required: false
        default: true
        description: Install xclip package
