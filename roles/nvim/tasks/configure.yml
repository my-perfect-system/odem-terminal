---
- name: Ensure per-user .venvs directory exists
  ansible.builtin.file:
    path: "{{ entity.home }}/.venvs"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_nvim | default(false)
    - entity.state == 'present'

- name: Create per-user nvim python venv
  ansible.builtin.command:
    cmd: sudo -u {{ entity.name }} python3 -m venv "{{ entity.home }}/.venvs/nvim"
    creates: "{{ entity.home }}/.venvs/nvim"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_nvim | default(false)
    - entity.state == 'present'

- name: Install nvim python packages into venv
  ansible.builtin.command:
    cmd: sudo -u {{ entity.name }} "{{ entity.home }}/.venvs/nvim/bin/pip" install ruff-lsp debugpy pynvim
    creates: "{{ entity.home }}/.venvs/nvim/bin/ruff-lsp"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_nvim | default(false)
    - entity.state == 'present'

- name: Deploy per-user nvim configuration tree
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/.config/nvim/"
    dest: "{{ entity.home }}/.config/nvim/"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
    directory_mode: "0700"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_nvim | default(false)
    - entity.state == 'present'

- name: Ensure per-user nvim-session directory exists
  ansible.builtin.file:
    path: "{{ entity.home }}/.config/nvim-session/"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_nvim | default(false)
    - entity.state == 'present'

- name: Ensure .venvs and .config/nvim-session directories exist
  ansible.builtin.file:
    path: "{{ item.0.home }}/{{ item.1 }}"
    state: directory
    owner: "{{ item.0.name }}"
    group: "{{ item.0.group | default(item.0.name) }}"
    mode: "0700"
    recurse: true
  loop: "{{ identity_users_present | product(['.venvs', '.config/nvim-session']) | list }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"
