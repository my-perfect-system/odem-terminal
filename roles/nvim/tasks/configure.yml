---
- name: "TERM_NVIM_CONFIGURE - Create .venvs directory"
  ansible.builtin.file:
    path: "{{ entity.home }}/.venvs"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ nvim_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: "TERM_NVIM_CONFIGURE - Create nvim Python venv"
  ansible.builtin.command:
    cmd: sudo -u {{ entity.name }} python3 -m venv "{{ entity.home }}/.venvs/nvim"
    creates: "{{ entity.home }}/.venvs/nvim"
  loop: "{{ nvim_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: "TERM_NVIM_CONFIGURE - Install pip packages into nvim venv"
  ansible.builtin.command:
    cmd: sudo -u {{ entity.name }} "{{ entity.home }}/.venvs/nvim/bin/pip" install ruff-lsp debugpy pynvim
    creates: "{{ entity.home }}/.venvs/nvim/bin/ruff-lsp"
  loop: "{{ nvim_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: "TERM_NVIM_CONFIGURE - Deploy .config/nvim/"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/.config/nvim/"
    dest: "{{ entity.home }}/.config/nvim/"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
    directory_mode: "0700"
  loop: "{{ nvim_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: "TERM_NVIM_CONFIGURE - Create .config/nvim-session/ directory"
  ansible.builtin.file:
    path: "{{ entity.home }}/.config/nvim-session/"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ nvim_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: "TERM_NVIM_CONFIGURE - Fix ownership of .venvs and .config/nvim-session"
  ansible.builtin.file:
    path: "{{ item.0.home }}/{{ item.1 }}"
    state: directory
    owner: "{{ item.0.name }}"
    group: "{{ item.0.group | default(item.0.name) }}"
    mode: "0700"
    recurse: true
  loop: "{{ nvim_users_present | product(['.venvs', '.config/nvim-session']) | list }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"
