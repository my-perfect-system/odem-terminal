---
# System-level install
- name: Install nvim apt dependencies
  ansible.builtin.package:
    name:
      - lazygit
      - make
      - gcc
      - gdb
      - wget
      - bzip2
      - curl
      - build-essential
      - lldb
      - libncurses-dev
      - ruby
      - npm
      - fzf
      - fd-find
      - rr
      - ripgrep
      - shellcheck
      - xclip
      - xsel
      - luarocks
      - chktex
      - ansible-lint
      - python3
      - python3-venv
      - python3-pip
      - black
      - flake8
      - pylint
      - mypy
      - pandoc
      - python3-neovim
      - python3-pynvim
    state: present
  when: nvim_enable_apt_deps | bool

- name: Install nvim npm tools globally
  ansible.builtin.command:
    cmd: npm install -g neovim vint luacheck
    creates: /usr/lib/node_modules/neovim
  when: nvim_enable_npm_tools | bool

- name: Ensure nvim tarball target directory exists
  ansible.builtin.file:
    path: /usr/share/mps/tools/nvim/
    state: directory
    mode: "0755"
  when: nvim_enable_tarball | bool

- name: Download nvim upstream tarball
  ansible.builtin.get_url:
    url: https://github.com/neovim/neovim/releases/download/v0.12.1/nvim-linux-x86_64.tar.gz
    dest: /usr/share/mps/tools/nvim/
    mode: "0644"
  when: nvim_enable_tarball | bool

- name: Extract nvim tarball
  ansible.builtin.unarchive:
    src: /usr/share/mps/tools/nvim/nvim-linux-x86_64.tar.gz
    dest: /usr/share/mps/tools/nvim/
    remote_src: true
  when: nvim_enable_tarball | bool

- name: Remove pre-existing /usr/bin/nvim if present
  ansible.builtin.file:
    path: /usr/bin/nvim
    state: absent
    # failed_when: false
  when: nvim_enable_tarball | bool

- name: Symlink nvim into /usr/local/bin
  ansible.builtin.file:
    src: /usr/share/mps/tools/nvim/nvim-linux-x86_64/bin/nvim
    dest: /usr/local/bin/nvim
    state: link
  when: nvim_enable_tarball | bool

# Per-user configure
- name: Ensure per-user .venvs directory exists
  ansible.builtin.file:
    path: "{{ entity.home }}/.venvs"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ identity_users_resolved | odem.base.odem_filter_users('terminal_nvim') }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Create per-user nvim python venv
  ansible.builtin.command:
    cmd: sudo -u {{ entity.name }} python3 -m venv "{{ entity.home }}/.venvs/nvim"
    creates: "{{ entity.home }}/.venvs/nvim"
  loop: "{{ identity_users_resolved | odem.base.odem_filter_users('terminal_nvim') }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Install nvim python packages into venv
  ansible.builtin.command:
    cmd: sudo -u {{ entity.name }} "{{ entity.home }}/.venvs/nvim/bin/pip" install ruff-lsp debugpy pynvim
    creates: "{{ entity.home }}/.venvs/nvim/bin/ruff-lsp"
  loop: "{{ identity_users_resolved | odem.base.odem_filter_users('terminal_nvim') }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Check if mps-nvim directory exists
  ansible.builtin.stat:
    path: "{{ nvim_repos_dir }}/mps-nvim"
  register: nvim_repo_dir

- name: Check if mps-nvim is a Git repository
  ansible.builtin.stat:
    path: "{{ nvim_repos_dir }}/mps-nvim/.git"
  register: nvim_git_dir
  when: nvim_repo_dir.stat.exists

- name: Clone mps-nvim repository
  ansible.builtin.git:
    repo: "{{ nvim_repo }}"
    dest: "{{ nvim_repos_dir }}/mps-nvim"
    version: "{{ nvim_version }}"
    force: true
  become: true
  when: not nvim_repo_dir.stat.exists

- name: Pull mps-nvim repository
  ansible.builtin.git:
    repo: "{{ nvim_repo }}"
    dest: "{{ nvim_repos_dir }}/mps-nvim"
    version: "{{ nvim_version }}"
    force: true
    update: true
  become: true
  when:
    - nvim_repo_dir.stat.exists
    - nvim_git_dir.stat.exists

- name: Deploy per-user nvim configuration tree
  ansible.builtin.copy:
    src: "{{ nvim_repos_dir }}/mps-nvim/"
    dest: "{{ entity.home }}/.config/nvim/"
    remote_src: true
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
    directory_mode: "0700"
  loop: "{{ identity_users_resolved | odem.base.odem_filter_users('terminal_nvim') }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Remove per-user nvim .git dir
  ansible.builtin.file:
    path: "{{ nvim_repos_dir }}/mps-nvim/.git"
    state: absent
  loop: "{{ identity_users_resolved | odem.base.odem_filter_users('terminal_nvim') }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Ensure per-user nvim-session directory exists
  ansible.builtin.file:
    path: "{{ entity.home }}/.config/nvim-session/"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
  loop: "{{ identity_users_resolved | odem.base.odem_filter_users('terminal_nvim') }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Ensure .venvs and .config/nvim-session directories exist
  ansible.builtin.file:
    path: "{{ item.0.home }}/{{ item.1 }}"
    state: directory
    owner: "{{ item.0.name }}"
    group: "{{ item.0.group | default(item.0.name) }}"
    mode: "0700"
    recurse: true
  loop: "{{ identity_users_present | product(['.venvs', '.config/nvim-session']) | list }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"

# Companion tools
- name: Download yazi tarball
  ansible.builtin.get_url:
    url: "https://github.com/sxyazi/yazi/releases/download/{{ nvim_yazi_version }}/yazi-x86_64-unknown-linux-gnu.zip"
    dest: "/tmp/yazi-x86_64-unknown-linux-gnu.zip"
    mode: "0644"
  when: nvim_enable_yazi | bool

- name: Ensure yazi extract directory exists
  ansible.builtin.file:
    path: /tmp/yazi-extract
    state: directory
    mode: "0755"
  when: nvim_enable_yazi | bool

- name: Extract yazi archive
  ansible.builtin.unarchive:
    src: /tmp/yazi-x86_64-unknown-linux-gnu.zip
    dest: /tmp/yazi-extract
    remote_src: true
  when: nvim_enable_yazi | bool

- name: Install yazi and ya per user
  ansible.builtin.copy:
    src: "/tmp/yazi-extract/yazi-x86_64-unknown-linux-gnu/{{ item.1 }}"
    dest: "{{ item.0.home }}/.cargo/bin/{{ item.1 }}"
    owner: "{{ item.0.name }}"
    group: "{{ item.0.group | default(item.0.name) }}"
    mode: "0700"
    remote_src: true
  loop: "{{ identity_users_resolved | odem.base.odem_filter_users('terminal_nvim') | product(['yazi', 'ya']) | list }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"
  when: nvim_enable_yazi | bool

- name: Clean up yazi download artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/yazi-x86_64-unknown-linux-gnu.zip
    - /tmp/yazi-extract
  when: nvim_enable_yazi | bool

- name: Install fd-find via cargo per user
  ansible.builtin.command:
    cmd: sudo -u {{ entity.name }} "{{ entity.home }}/.cargo/bin/cargo" install --locked fd-find
    creates: "{{ entity.home }}/.cargo/bin/fd"
  loop: "{{ identity_users_resolved | odem.base.odem_filter_users('terminal_nvim') }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when: nvim_enable_fd | bool

- name: Install tree-sitter-cli via cargo per user
  ansible.builtin.command:
    cmd: sudo -u {{ entity.name }} "{{ entity.home }}/.cargo/bin/cargo" install --locked tree-sitter-cli
    creates: "{{ entity.home }}/.cargo/bin/tree-sitter"
  loop: "{{ identity_users_resolved | odem.base.odem_filter_users('terminal_nvim') }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when: nvim_enable_tree_sitter | bool
