---
- name: Install kitty package (Debian)
  ansible.builtin.package:
    name: kitty
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install kitty package via dnf CLI
  ansible.builtin.command: dnf install -y kitty
  when: ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_kitty
  changed_when: "'Nothing to do' not in dnf_install_kitty.stdout"

- name: Set kitty as x-terminal-emulator alternative
  ansible.builtin.command:
    cmd: update-alternatives --set x-terminal-emulator /usr/bin/kitty
  changed_when: false
  failed_when: false
  when:
    - kitty_enable_alternatives | bool
    - ansible_facts['os_family'] == 'Debian'

- name: Deploy per-user kitty configuration tree
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/.config/kitty/"
    dest: "{{ entity.home }}/.config/kitty/"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
    directory_mode: "0700"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_kitty | default(false)
    - entity.state == 'present'
