---
- name: Assert Debian 13 target
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Debian"
      - ansible_facts["distribution_major_version"] | int == 13
    fail_msg: "This role supports Debian 13 (trixie) only"
    quiet: true

- name: Install fontconfig and unzip
  ansible.builtin.package:
    name:
      - fontconfig
      - unzip
    state: present

- name: Ensure fonts directory exists
  ansible.builtin.file:
    path: "{{ fonts_dir }}"
    state: directory
    mode: "0755"

- name: Stat existing font files
  ansible.builtin.stat:
    path: "{{ item.creates if item.creates is defined else item.dst_unzip_path + '/' + item.name + '.ttf' }}"
  loop: "{{ fonts_list }}"
  register: fonts_stat_results

- name: Download font archives
  ansible.builtin.get_url:
    url: "{{ item.0.url }}"
    dest: "{{ fonts_dir }}/{{ item.0.name }}{{ '.ttf' if item.0.file_only | default(false) else '.zip' }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ fonts_list | zip(fonts_stat_results.results) | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  when: not item.1.stat.exists

- name: Ensure font extract directories exist
  ansible.builtin.file:
    path: "{{ item.0.dst_unzip_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ fonts_list | zip(fonts_stat_results.results) | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  when: not item.1.stat.exists

- name: Unarchive font zip files
  ansible.builtin.unarchive:
    src: "{{ fonts_dir }}/{{ item.0.name }}.zip"
    dest: "{{ item.0.dst_unzip_path }}"
    creates: "{{ item.0.creates | default(omit) }}"
    owner: root
    group: root
    mode: "0644"
    remote_src: true
  loop: "{{ fonts_list | zip(fonts_stat_results.results) | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  when:
    - not item.0.file_only | default(false)
    - not item.1.stat.exists
  notify: Rebuild font cache

- name: Copy single-font files into place
  ansible.builtin.copy:
    src: "{{ fonts_dir }}/{{ item.0.name }}.ttf"
    dest: "{{ item.0.dst_unzip_path }}/{{ item.0.name }}.ttf"
    owner: root
    group: root
    mode: "0644"
    remote_src: true
  loop: "{{ fonts_list | zip(fonts_stat_results.results) | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  when:
    - item.0.file_only | default(false)
    - not item.1.stat.exists
  notify: Rebuild font cache

- name: Clean up downloaded font archives
  ansible.builtin.file:
    path: "{{ fonts_dir }}/{{ item.0.name }}{{ '.ttf' if item.0.file_only | default(false) else '.zip' }}"
    state: absent
  loop: "{{ fonts_list | zip(fonts_stat_results.results) | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  when:
    - item.0.cleanup | default(true)
    - not item.1.stat.exists
