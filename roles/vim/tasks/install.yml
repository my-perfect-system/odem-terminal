---
- name: Install vim-nox and addon packages
  ansible.builtin.package:
    name:
      - vim-nox
      - vim-addon-manager
      - vim-airline
      - vim-gruvbox
      - vim-ale
      - vim-autopep8
      - vim-ctrlp
      - vim-fugitive
      - vim-gitgutter
      - vim-snippets
      - vim-syntastic
      - vim-youcompleteme
    state: present
  when: vim_enable_vim_nox | bool

- name: Install lua development packages
  ansible.builtin.package:
    name:
      - liblua5.3-dev
      - liblua5.1-dev
      - lua5.1
      - lua5.3
    state: present
  when: vim_enable_lua | bool

- name: Install xclip package
  ansible.builtin.package:
    name: xclip
    state: present
  when: vim_enable_xclip | bool
