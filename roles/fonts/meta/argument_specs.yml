---
argument_specs:
  main:
    short_description: Install and register Nerd Fonts and other TTF fonts
    options:
      fonts_dir:
        type: str
        required: false
        default: /usr/share/fonts
        description: System font directory where downloaded fonts are installed
      fonts_list:
        type: list
        required: false
        elements: dict
        options:
          name:
            type: str
            required: true
            description: Font identifier used as filename prefix
          url:
            type: str
            required: true
            description: Download URL for the font archive or single TTF file
          dst_unzip_path:
            type: str
            required: true
            description: Destination directory for extracted font files
          creates:
            type: str
            required: false
            description: Sentinel file to check before re-downloading zip fonts
          file_only:
            type: bool
            required: false
            default: false
            description: When true, the font is a single TTF file (no unzip needed)
          cleanup:
            type: bool
            required: false
            default: true
            description: Remove the downloaded archive after extraction
        description: List of fonts to download and install
