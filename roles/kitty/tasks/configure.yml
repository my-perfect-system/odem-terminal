---
- name: "TERM_KITTY_CONFIGURE - Deploy kitty config"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/.config/kitty/"
    dest: "{{ entity.home }}/.config/kitty/"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
    directory_mode: "0700"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_kitty | default(false)
    - entity.state == 'present'
