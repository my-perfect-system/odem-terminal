---
- name: "TERM_SCRIPTS_CONFIGURE - Create ~/.local/bin for each user"
  ansible.builtin.file:
    path: "{{ entity.home }}/.local/bin"
    state: directory
    mode: "0700"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
  loop: "{{ scripts_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: "TERM_SCRIPTS_CONFIGURE - Copy scripts to ~/.local/bin"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/scripts/"
    dest: "{{ entity.home }}/.local/bin/"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
    directory_mode: "0700"
  loop: "{{ scripts_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: "TERM_SCRIPTS_CONFIGURE - Fix ownership of ~/.local/bin"
  ansible.builtin.file:
    path: "{{ entity.home }}/.local/bin"
    state: directory
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0700"
    recurse: true
  loop: "{{ scripts_users_present }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
