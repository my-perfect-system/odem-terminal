---
# System-level install
- name: Install bash-completion when enabled
  ansible.builtin.package:
    name: bash-completion
    state: present
  when: bash_enable_bash_completion | bool

- name: Install bash fun packages when enabled
  ansible.builtin.package:
    name: "{{ bash_fun_packages }}"
    state: present
  when: bash_enable_fun_packages | bool and bash_fun_packages | length > 0

- name: Ensure /etc/bash_aliases.d exists when aliases enabled
  ansible.builtin.file:
    path: /etc/bash_aliases.d
    state: directory
    mode: "0755"
  when: bash_enable_aliases | bool

- name: Deploy system bash aliases when enabled
  ansible.builtin.copy:
    src: "{{ role_path }}/files/etc/bash_aliases.d/"
    dest: /etc/bash_aliases.d/
    mode: "0644"
    directory_mode: true
  when: bash_enable_aliases | bool

# Per-user configure
- name: Deploy per-user .bashrc
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/.bashrc"
    dest: "{{ entity.home }}/.bashrc"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
  loop: "{{ identity_users_resolved | mps_filter_users('terminal_bash') }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Deploy per-user .config/bashrc directory
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/.config/bashrc/"
    dest: "{{ entity.home }}/.config/bashrc/"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
    directory_mode: "0700"
  loop: "{{ identity_users_resolved | mps_filter_users('terminal_bash') }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Check for legacy .bash_logout per user
  ansible.builtin.stat:
    path: "{{ entity.home }}/.bash_logout"
  loop: "{{ identity_users_resolved | mps_filter_users('terminal_bash') }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  register: bash_logout_stat

- name: Migrate legacy .bash_logout into bashrc dir
  ansible.builtin.copy:
    src: "{{ item.entity.home }}/.bash_logout"
    dest: "{{ item.entity.home }}/.config/bashrc/.bash_logout"
    owner: "{{ item.entity.name }}"
    group: "{{ item.entity.group | default(item.entity.name) }}"
    mode: "0600"
    remote_src: true
  loop: "{{ bash_logout_stat.results }}"
  loop_control:
    loop_var: item
    label: "{{ item.entity.name }}"
  when: item.stat.exists

- name: Remove legacy .bash_history per user
  ansible.builtin.file:
    path: "{{ entity.home }}/.bash_history"
    state: absent
  loop: "{{ identity_users_resolved | mps_filter_users('terminal_bash') }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Remove legacy .bash_logout per user
  ansible.builtin.file:
    path: "{{ entity.home }}/.bash_logout"
    state: absent
  loop: "{{ identity_users_resolved | mps_filter_users('terminal_bash') }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Remove legacy .bashrc_aliases per user
  ansible.builtin.file:
    path: "{{ entity.home }}/.bashrc_aliases"
    state: absent
  loop: "{{ identity_users_resolved | mps_filter_users('terminal_bash') }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"

- name: Remove legacy .bash_aliases per user
  ansible.builtin.file:
    path: "{{ entity.home }}/.bash_aliases"
    state: absent
  loop: "{{ identity_users_resolved | mps_filter_users('terminal_bash') }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
