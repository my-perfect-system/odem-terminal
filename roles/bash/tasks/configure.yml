---
- name: "TERM_BASH_CONFIGURE - Deploy .bashrc"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/.bashrc"
    dest: "{{ entity.home }}/.bashrc"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_bash | default(false)
    - entity.state == 'present'

- name: "TERM_BASH_CONFIGURE - Deploy .config/bashrc/ directory"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/.config/bashrc/"
    dest: "{{ entity.home }}/.config/bashrc/"
    owner: "{{ entity.name }}"
    group: "{{ entity.group | default(entity.name) }}"
    mode: "0600"
    directory_mode: "0700"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_bash | default(false)
    - entity.state == 'present'

- name: "TERM_BASH_CONFIGURE - Check for .bash_logout"
  ansible.builtin.stat:
    path: "{{ entity.home }}/.bash_logout"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_bash | default(false)
    - entity.state == 'present'
  register: bash_logout_stat

- name: "TERM_BASH_CONFIGURE - Copy .bash_logout to .config/bashrc/ if not already present"
  ansible.builtin.copy:
    src: "{{ item.entity.home }}/.bash_logout"
    dest: "{{ item.entity.home }}/.config/bashrc/.bash_logout"
    owner: "{{ item.entity.name }}"
    group: "{{ item.entity.group | default(item.entity.name) }}"
    mode: "0600"
    remote_src: true
  loop: "{{ bash_logout_stat.results }}"
  loop_control:
    loop_var: item
    label: "{{ item.entity.name }}"
  when: item.stat.exists

- name: "TERM_BASH_CONFIGURE - Delete stale .bash_history"
  ansible.builtin.file:
    path: "{{ entity.home }}/.bash_history"
    state: absent
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_bash | default(false)
    - entity.state == 'present'

- name: "TERM_BASH_CONFIGURE - Delete stale .bash_logout"
  ansible.builtin.file:
    path: "{{ entity.home }}/.bash_logout"
    state: absent
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_bash | default(false)
    - entity.state == 'present'

- name: "TERM_BASH_CONFIGURE - Delete stale .bashrc_aliases"
  ansible.builtin.file:
    path: "{{ entity.home }}/.bashrc_aliases"
    state: absent
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_bash | default(false)
    - entity.state == 'present'

- name: "TERM_BASH_CONFIGURE - Delete stale .bash_aliases"
  ansible.builtin.file:
    path: "{{ entity.home }}/.bash_aliases"
    state: absent
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when:
    - entity.user_roles.terminal_bash | default(false)
    - entity.state == 'present'
