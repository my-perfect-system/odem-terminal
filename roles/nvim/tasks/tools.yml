---
- name: Download yazi tarball
  ansible.builtin.get_url:
    url: "https://github.com/sxyazi/yazi/releases/download/{{ nvim_yazi_version }}/yazi-x86_64-unknown-linux-gnu.zip"
    dest: "/tmp/yazi-x86_64-unknown-linux-gnu.zip"
    mode: "0644"
  when: nvim_enable_yazi | bool

- name: Ensure yazi extract directory exists
  ansible.builtin.file:
    path: /tmp/yazi-extract
    state: directory
    mode: "0755"
  when: nvim_enable_yazi | bool

- name: Extract yazi archive
  ansible.builtin.unarchive:
    src: /tmp/yazi-x86_64-unknown-linux-gnu.zip
    dest: /tmp/yazi-extract
    remote_src: true
  when: nvim_enable_yazi | bool

- name: Install yazi and ya per user
  ansible.builtin.copy:
    src: "/tmp/yazi-extract/yazi-x86_64-unknown-linux-gnu/{{ item.1 }}"
    dest: "{{ item.0.home }}/.cargo/bin/{{ item.1 }}"
    owner: "{{ item.0.name }}"
    group: "{{ item.0.group | default(item.0.name) }}"
    mode: "0700"
    remote_src: true
  loop: "{{ identity_users_present | product(['yazi', 'ya']) | list }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"
  when: nvim_enable_yazi | bool

- name: Clean up yazi download artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/yazi-x86_64-unknown-linux-gnu.zip
    - /tmp/yazi-extract
  when: nvim_enable_yazi | bool

- name: Install fd-find via cargo per user
  ansible.builtin.command:
    cmd: sudo -u {{ entity.name }} "{{ entity.home }}/.cargo/bin/cargo" install --locked fd-find
    creates: "{{ entity.home }}/.cargo/bin/fd"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when: nvim_enable_fd | bool

- name: Install tree-sitter-cli via cargo per user
  ansible.builtin.command:
    cmd: sudo -u {{ entity.name }} "{{ entity.home }}/.cargo/bin/cargo" install --locked tree-sitter-cli
    creates: "{{ entity.home }}/.cargo/bin/tree-sitter"
  loop: "{{ identity_users_resolved }}"
  loop_control:
    loop_var: entity
    label: "{{ entity.name }}"
  when: nvim_enable_tree_sitter | bool
